name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle Web Assets into APK Assets
        run: |
          python -c "import build_apk; build_apk.setup_assets()"

      - name: Build Debug APK
        run: |
          cd APK
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy and Commit APK
        run: |
          cp APK/app/build/outputs/apk/debug/app-debug.apk WuvosMusic.apk
          git add WuvosMusic.apk
          if git diff --staged --quiet; then
            echo "No changes in APK."
          else
            git commit -m "chore: update compiled WuvosMusic.apk [skip ci]"
            git push origin main
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WuvosMusic-v1.1.0-debug.apk
          path: WuvosMusic.apk
