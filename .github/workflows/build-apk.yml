name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle Web Assets into APK Assets
        run: |
          # Clean and create assets folder
          rm -rf APK/app/src/main/assets
          mkdir -p APK/app/src/main/assets
          
          # Copy files (explicitly excluding the APK folder itself)
          cp templates/index.html APK/app/src/main/assets/index.html
          cp -r static APK/app/src/main/assets/static
          cp git_config.json APK/app/src/main/assets/git_config.json

      - name: Build Debug APK
        run: |
          cd APK
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy and Commit APK
        run: |
          cp APK/app/build/outputs/apk/debug/app-debug.apk WuvosMusic.apk
          git add WuvosMusic.apk
          if git diff --staged --quiet; then
            echo "No changes in APK."
          else
            git commit -m "chore: update compiled WuvosMusic.apk [skip ci]"
            # Extract personal access token from git_config.json
            TOKEN=$(jq -r '.token' git_config.json)
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              git push "https://x-access-token:${TOKEN}@github.com/axay786/WuvosMusic.git" HEAD:main
            else
              echo "No token found in git_config.json, attempting default push..."
              git push origin HEAD:main
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WuvosMusic-v1.1.0-debug.apk
          path: WuvosMusic.apk
